services:
  postgres:
    image: postgres:16-alpine
    container_name: arenabeach-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: arenabeach
    ports:
      - "5433:5432"
    volumes:
      - arenabeach_pgdata:/var/lib/postgresql/data

volumes:
  arenabeach_pgdata:
